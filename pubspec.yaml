name: nudge_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/nudge_logo_light.png
    - assets/images/nudge_logo_dark.png
    - assets/images/nudge_primary_logo.png
    - assets/images/nudge_app_icon.png
    - assets/images/nudge_logo_monochrome.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/nudge_app_icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/images/nudge_app_icon.png"